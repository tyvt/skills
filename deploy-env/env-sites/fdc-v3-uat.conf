# project=fdc-v3  env=uat  port=8103  gateway=http://127.0.0.1:8080
server {
    listen 8103;
    server_name _;
    root D:/repository/苏州市房地产监测V3/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|xlsx)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }
    # 业务 API：/api/v3.0 → /v3.0 后打到本环境网关
    location /api/v3.0/ {
        rewrite ^/api/v3.0/(.*)$ /v3.0/$1 break;
        proxy_pass http://127.0.0.1:8080;
    }
    location /zhi2/      { proxy_pass http://127.0.0.1:8080; }
    location /zhi2-dev/  { proxy_pass http://127.0.0.1:8080; }
    location /zhi2-test/ { proxy_pass http://127.0.0.1:8080; }

    # SPA history 回退
    location / { try_files $uri $uri/ /index.html; }
    # 禁止访问隐藏文件
    location ~ /\. { deny all; }
}