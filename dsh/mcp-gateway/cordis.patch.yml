# 本 bundle 自己的行。
#
# cordis 的 patch 规则：非 insert 的 patch 必须命中已存在的条目，条目不存在会
# 被跳过并报 `entry not found`。所以新增插件必须用 `insert` 往树里插入。
# profile 级覆盖（~/.dsh/profiles/web/cordis.patch.yml）在本文件之后应用，
# 那里可以直接用 `id:` 命中这一条。
# 注意：下方 command/args 含本机绝对路径（dbx-mcp.exe、node、context-mode、openviking proxy），
# 换机器/换安装位置时需按实际路径调整，或改用 profile 级覆盖。
- insert:
    - id: mcp-gateway
      name: dsh-mcp-gateway
      config:
        # 单次 tools/call 超时。dbx 的长查询偶尔超过 30 s，60 s 更稳。
        toolCallTimeoutMs: 60000
        # 单次 tools/list 超时。
        listTimeoutMs: 15000
        servers:
          dbx:
            command: 'C:\Users\Administrator\.dbx\bin\dbx-mcp.exe'
            args: []
            # hint 会拼进 mcp_gateway 的工具描述，帮模型判断该不该调。
            hint: 禅道与业务数据库（表结构、SQL、Redis、Kafka），只读查询优先
          context-mode:
            command: 'node'
            args:
              - 'D:/nvm/v22.23.2/node_modules/context-mode/cli.bundle.mjs'
            hint: 沙箱化工具输出与历史会话全文检索（大日志/跨会话回忆）
          # [A-1 ovgw] OpenViking 记忆/资源库：接管原本直连常驻的 24 个工具，
          # 改为按需 list/call。proxy 自身是合规 stdio MCP server（已实测 initialize+tools/list 通过），
          # 从 ~/.dsh/ov.conf 解析连接，无需额外 env。
          openviking:
            command: 'D:\nvm\nodejs\node.exe'
            args:
              - 'C:/Users/Administrator/.dsh/profiles/web/node_modules/@openviking/dsh-memory-plugin/servers/mcp-proxy.mjs'
            hint: OpenViking 记忆/资源库（find/search/read/write/remember/tree/list…按需）
            startupTimeoutMs: 30000
