# 本 bundle 自己的行。
#
# cordis 的 patch 规则：非 insert 的 patch 必须命中已存在的条目，条目不存在会
# 被跳过并报 `entry not found`。所以新增插件必须用 `insert` 往树里插入。
# profile 级覆盖（~/.dsh/profiles/web/cordis.patch.yml）在本文件之后应用，
# 那里可以直接用 `id:` 命中这一条。
- insert:
    - id: mcp-gateway
      name: dsh-mcp-gateway
      config:
        # 单次 tools/call 超时。dbx 的长查询偶尔超过 30 s，60 s 更稳。
        toolCallTimeoutMs: 60000
        # 单次 tools/list 超时。
        listTimeoutMs: 15000
        servers:
          dbx:
            command: 'C:\Users\Administrator\.dbx\bin\dbx-mcp.exe'
            args: []
            # hint 会拼进 mcp_gateway 的工具描述，帮模型判断该不该调。
            hint: 禅道与业务数据库（表结构、SQL、Redis、Kafka），只读查询优先
          context-mode:
            command: 'node'
            args:
              - 'D:/nvm/v22.23.2/node_modules/context-mode/cli.bundle.mjs'
            hint: 沙箱化工具输出与历史会话全文检索（大日志/跨会话回忆）
