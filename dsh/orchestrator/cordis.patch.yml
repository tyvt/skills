# 本 bundle 自己的行。cordis patch 规则：非 insert 的 patch 必须命中已存在条目，
# 新增插件必须用 `insert` 往树里插入。profile 级覆盖在本文件之后应用。
- insert:
    - id: orchestrator
      name: dsh-orchestrator
      config:
        # Python 解释器
        pythonExe: python
        # 编排器项目根目录(含 src/jsonbridge.py 与 config.yaml)
        projectDir: 'D:\repository\skills\dsh\langgraph-orchestrator'
        # 单次编排调用超时(毫秒)。完整编排会跑多个模型，给足时间。
        timeoutMs: 300000
        # 是否把完整 trace/steps 也返回给模型(否则只返回 final，省 token)
        verbose: false
