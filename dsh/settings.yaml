llm-pi-ai:
  providers:
    magpie:
      displayName: Magpie
      apiKeyEnv: MAGPIE_GATEWAY_KEY
      api: openai-completions
      # magpie: points at magpie's local gateway; Disconnect in magpie or `magpie uninstall` undoes it, or remove this entry and pick another model
      baseURL: http://127.0.0.1:3425/v1
      models:
        - id: auto/hy3
          name: Hy3 · routing group
          contextWindow: 192000
          maxTokens: 48000
          input: [text, image]
          reasoningEfforts:
            low: low
            high: high
        - id: auto/deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash · routing group
          contextWindow: 1000000
          maxTokens: 128000
          input: [text, image]
          reasoningEfforts:
            low: low
            high: high
        - id: cursor/grok-4.7@256k
          name: Grok 4.7 @ 256k · Cursor
          contextWindow: 256000
          input: [text, image]
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        - id: cursor/deepseek-v41-flash-1017
          name: DeepSeek V4.1 Flash 1017 · Cursor
          contextWindow: 1048576
          input: [text, image]
          reasoningEfforts:
            "off": none
            low: low
            medium: medium
            high: high
            max: max
