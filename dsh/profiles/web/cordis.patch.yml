# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# 飞书双向会话、原生问答和文件投递已接入，模型预设按 DSH setup 契约挂载。
# 实现在 ~/.dsh/dcwhc（独立目录，跳过了 node_modules），所以
# `dsh plugin update` 或 pnpm 升级都不会覆盖它。
# 默认配置见 ~/.dsh/dcwhc/cordis.patch.yml；这里只写需要覆盖的字段。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
    performanceUsage: detailed
- id: agent-default-model # magpie
  config:
    provider: magpie
    model: auto/deepseek-v4.1-flash
    reasoningEffort: off
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false

# OpenViking 记忆：写回更勤、召回略严（2026-11-05）
- id: openviking-memory-runtime
  name: "@openviking/dsh-memory-plugin"
  config:
    endpoint: http://127.0.0.1:1933
    commitTokenThreshold: 8000
    captureToolResults: true
    skipSubagentSessions: true
    recallMaxTokens: 2200
    scoreThreshold: 0.40
    recallDedupTurns: 8
    recallPeerScope: actor
    mcpToolCallTimeoutMs: 90000

# 自定义插件市场「发现」页索引源（等价于 UI 添加索引源）
- id: plugin-market
  config:
    indexes:
      - https://dshopen.org/index.json

# ── MCP：改由 dsh-mcp-gateway 按需代理（不再常驻 36 个工具）────────────────
# 旧的 mcp-dbx（25 工具 / 20,357 字符）与 mcp-context-mode（11 工具 / 27,899 字符）
# 每步固定重发 ≈13,049 token，而门户项目 15 个会话 955 步里调用 0 次。
# 现在由本机插件 dsh-mcp-gateway 提供一个入口工具 mcp_gateway（≈826 字符），
# 首次调用时才拉起子进程。服务端清单在 ~/.dsh/mcp-gateway/cordis.patch.yml。
#
# 为什么不用「默认 disabled + 环境变量开」：环境变量只在 dsh web 启动时存在，
# agent 看不见也改不了；plugin_manager 在 standard/ptc/minimal 三个 preset 里
# 本来就是 disabled，agent 没有开启能力；deferLoading 在 magpie 的
# openai-completions 模型上没有 compat 声明，会被剥掉当普通工具发送。
# 所以「保证触发」只能靠工具表里始终存在的入口工具，而不是开关。
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
    fontSize: 16

# ============================================================================
# Token 优化补丁（来自 token-audit 报告：都做）
# 说明：主 agent 与子 agent 实际都跑 preset（默认 standard），host 层的
# tool-fs / compaction-basic / tool-skill 只是 bundle 兜底，因此 ②/④/⑤ 必须
# 改写 preset 内部的嵌套副本。patch 引擎按裸 id 匹配且「文件中后者覆盖前者」，
# 裸 id 会命中 preset-cordis 而非 standard，故改用「往具体 preset 组 insert
# 同名插件的新 id 副本」来覆盖（loader 按 name 决议，同名后者生效）。
# ============================================================================

# ②/④/⑤ standard 主 agent 的 preset 副本：整段替换 preset-standard 的
# config（patch 引擎按裸 id 匹配且只整段替换 config，不能 insert 进
# config.plugins）。仅新增三个 config 块，其余与 bundle 默认保持一致。
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          readLimit: 400
          readMaxBytes: 24576
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
        config:
          catalogDescriptionMaxLength: 120
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: >
                You are in plan mode. Stay in plan mode until the user approves
                your plan through exit_plan_mode or switches the session mode.
                Imperative language to implement changes means plan the
                implementation, not execute it. A user's conversational
                agreement — including an answer confirming something you asked —
                approves nothing and does not end plan mode; fold the confirmed
                decision into the plan and submit it through exit_plan_mode.


                Explore first. Use non-mutating reads, searches, static
                analysis, and checks to ground the plan in the actual
                repository. Do not edit or write files, change configuration,
                run formatters or code generation that rewrites tracked files,
                commit, or otherwise carry out the plan. Prefer existing
                functions and patterns over new machinery.


                The tool catalog stays the same across modes for request-cache
                stability. These plan-mode rules override any later tool
                description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do
                not use todo_write to track this planning phase: it tracks
                implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.


                Resolve discoverable facts by inspection. Use ask_user_question
                only for user-owned choices or material ambiguity that
                inspection cannot answer. Do not ask the user where code lives
                or how current behavior works when you can find out.


                Make the plan decision-complete: state the goal and success
                criteria; group implementation changes by subsystem; identify
                public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit
                assumptions. Keep it concise enough to review but detailed
                enough that another engineer can implement it without making
                design decisions.


                When ready, call exit_plan_mode with the complete plan markdown,
                starting with a # title. Make exit_plan_mode the only and final
                tool call in that assistant response: it presents the plan for
                approval, and implementation begins only in a later step after
                approval. Do not paste the final plan as a plain reply or ask
                "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again.
                If the review channel is unavailable or aborted, stay in plan
                mode and ask the user to switch modes manually; do not proceed
                with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              thresholdRatio: 0.4
              # modelPolicies（2026-10-28）：钳制大窗口模型的压缩触发线。
              # 与 Magpie 模型表同步解耦：模型表会把窗口回写成 1M/500k，modelPolicies 不受影响。
              # 1M * 0.1024 = 102400 → 触发线回到健康区间；maxTokens 兜底 min() 公式。
              modelPolicies:
                - provider: magpie
                  model: workbuddy/deepseek-v4.1-flash
                  thresholdRatio: 0.1024
                  retainTokens: 12000
                - provider: magpie
                  model: workbuddy/glm-5.3-flash
                  thresholdRatio: 0.1024
                  retainTokens: 12000
                - provider: magpie
                  model: workbuddy-ai/deepseek-v4.1-flash
                  thresholdRatio: 0.1024
                  retainTokens: 12000
                - provider: magpie
                  model: workbuddy-ai/deepseek-v4.1-flash-sg
                  thresholdRatio: 0.1024
                  retainTokens: 12000
                - provider: magpie
                  model: raccoon/sn-glm-5-3-flash
                  thresholdRatio: 0.1024
                  retainTokens: 12000
                - provider: magpie
                  model: autoclaw-cn/zai_glm-5.3-flash
                  thresholdRatio: 0.1024
                  retainTokens: 12000
                - provider: magpie
                  model: codex/gpt-6.1-sol
                  thresholdRatio: 0.2048
                  retainTokens: 12000
                - provider: magpie
                  model: minimax-code/MiniMax-M3.1-Flash
                  thresholdRatio: 0.1024
                  retainTokens: 12000
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 4096
              headChars: 2048
              tailChars: 768
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            disabled: true
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
            disabled: true
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
            disabled: true
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true

- id: agent-preset-registry
  config:
    default: standard
    selectedDefault: standard
  # 关掉后所有任务由主 agent 自己完成，代价是失去并行扇出与 workflow 编排。
  # 实际生效的开关在 preset-standard 的 delegation 分组里（六条 disabled），
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true
  config:
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true
  config:
- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    # 2026-11-09 token 优化：原 12500 → 3000 → 现 1500。
    # spill-policy 在 tools/post-execute 逐次调用就裁剪（非等 compaction），但跳过 read。
