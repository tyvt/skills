# dsh-token-guard bundle 自身挂载。
# cordis patch 规则：顶层 `- id:` 命中已存在条目则是配置覆盖；新增条目需 `insert:`
# 往树里插。本插件为全新条目，故用 insert；profile 级覆盖在其之后应用。
- insert:
    - id: token-guard
      name: dsh-token-guard
      config:
        enabled: true
        readBudgetTokens: 4000
        inlineTokens: 1500
        # 非 build 类 pwsh 读取输出（Get-Content/Select-String 等）超此值即头尾裁剪+落盘。
        pwshReadMaxLines: 200
        pwshHeadLines: 120
        pwshTailLines: 40
