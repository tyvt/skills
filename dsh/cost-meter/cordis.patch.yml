# dsh-cost-meter bundle 自身挂载。
- insert:
    - id: cost-meter
      name: dsh-cost-meter
      config:
        enabled: true
        sessionEquivBudget: 8000000
        perStepUncachedBudget: 10000
        perStepOutputBudget: 3000
        sessionUncachedBudget: 3000000
        # A2：单会话步数达此值提醒「评估收尾/无效步」（仅提醒不阻断）。<=0 关闭。
        stepReminderThreshold: 120
        # 2026-11-21：步数硬拦门槛。步数>=此值且为探索型工具时经 tools.guard 拒绝，
        # 逼收尾/换会话；收尾工具(edit/write/present/ask)始终放行。
        # 250 = 昨日 ledger 回放定阈：48 会话命中 3(6.3%)，精准拦 298/307/511 步极端长尾，不误伤正常复杂任务。
        # <=0 关闭；env DSH_COST_METER_ENFORCE=0 一键全关。
        stepGuardThreshold: 250
        # 2026-11-21：同类可自愈错误连续门槛。连续>=3 次同形态错误即拦，逼换工具/加载 tool-call-hygiene。
        # <=0 关闭。
        errorStreakThreshold: 3
        # A2：一次 ask_user_question 等待达此毫秒数，下步提醒。<=0 关闭。
        askUserLongWaitMs: 300000
        # 自动链式交接：累计等效成本越过档位即注入 P0 硬交接指令（agent 写交接文档+排程）。
        # 档位 early=15万 / mid=100万 / budget=800万；默认 early（用户选择，贴近超预算体感）。
        autoHandoff: true
        autoHandoffAt: early
        maxHandoffHops: 10
