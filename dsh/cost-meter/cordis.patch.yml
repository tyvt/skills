# dsh-cost-meter bundle 自身挂载。
- insert:
    - id: cost-meter
      name: dsh-cost-meter
      config:
        enabled: true
        sessionEquivBudget: 8000000
        perStepUncachedBudget: 10000
        perStepOutputBudget: 3000
        sessionUncachedBudget: 3000000
        # A2：单会话步数达此值提醒「评估收尾/无效步」（仅提醒不阻断）。<=0 关闭。
        stepReminderThreshold: 120
        # A2：一次 ask_user_question 等待达此毫秒数，下步提醒。<=0 关闭。
        askUserLongWaitMs: 300000
        # 自动链式交接：累计等效成本越过档位即注入 P0 硬交接指令（agent 写交接文档+排程）。
        # 档位 early=15万 / mid=100万 / budget=800万；默认 early（用户选择，贴近超预算体感）。
        autoHandoff: true
        autoHandoffAt: early
        maxHandoffHops: 10
