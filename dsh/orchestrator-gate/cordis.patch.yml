# dsh-orchestrator-gate bundle 自身挂载。
# 规则开关硬编码在 lib/index.js（方案 B），config 只留 enabled 总开关与阈值。
# 规则（2026-11-12 更新）：
#   - blockRootGrep / blockWholeRead：全项目覆盖，任意 cwd 下均生效，不再依赖 repoRoots 白名单。
#   - blockEditWithoutPlan：编码/样式改动（edit/write）首次落地前必须先 todo_write 出计划，全项目覆盖。
# repoRoots 仅作为 cwd 缺失时的兜底基准；moduleRoots 为 grep 深度豁免白名单。
- insert:
    - id: orchestrator-gate
      name: dsh-orchestrator-gate
      config:
        enabled: true
        # 注意：绝对路径为本机默认；换检出目录时改这里。
        repoRoots:
          - "D:\\repository\\skills"
        moduleRoots:
          - "src/views/"
          - "dsh/"
        grepMinDepth: 2
        grepFailClosedWhenNoRepoRoot: false
        wholeReadBytesVue: 61440
        wholeReadBytesOther: 40960
