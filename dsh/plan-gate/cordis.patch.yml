# dsh-plan-gate bundle 自身挂载。
# 在 edit/write/apply_patch 等改动类工具落地前，校验仓库根下是否存在
# 已审核通过(status: approved)且已人工确认(human_confirmed: true)的 Markdown 计划。
# 计划模板见本插件 .plan/TEMPLATE.md。
- insert:
    - id: plan-gate
      name: dsh-plan-gate
      config:
        enabled: true
        # 计划全局根（绝对路径）：最终目录 = <planRoot>/<工作区目录名>。
        # 留空时回退 <root>/.plan（兼容旧行为）；可用环境变量 DSH_PLAN_ROOT 覆盖。
        planRoot: "D:\\plan"
        # 回退目录名：仅在 planRoot 留空时生效。
        planDir: ".plan"
        # 需要门禁的改动类工具。
        guardTools:
          - edit
          - write
          - apply_patch
          - pwsh
        # 人工确认后落盘的终态：frontmatter 需同时满足以下两键，否则视为未放行。
        requireFrontmatter:
          status: approved
          human_confirmed: true
        # 仓库根兜底（cwd 缺失时用）。留空则仅用运行时 cwd。
        repoRoot: ""
