# =============================================================================
# LangGraph Orchestrator — 配置驱动的「工具 -> 模型池」编排
# =============================================================================
# 设计目标：
#   1. 每个工具(tool)绑定一个「模型池」。池内第一个是可用的主模型，后续是备用。
#   2. 主模型调用失败(异常/超时/空回复/触发 retry_on 关键字)时，自动降级到下一个。
#   3. 全部走本机 magpie 网关(OpenAI 兼容)，模型名即 /v1/models 暴露的 id。
#   4. 可全局覆盖网关地址/并发/超时；每个模型可单独覆盖 temperature/max_tokens。
# =============================================================================

gateway:
  base_url: http://127.0.0.1:3425/v1
  api_key: magpie
  # 单次请求超时(秒)。90s 让卡住的请求更早失败、更快切下一个模型；
  # 单个工具可再用 tools.*.timeout 覆盖（planner/code_editor 已定 120）。
  request_timeout: 90
  # 同一个模型内部重试次数。0 = 不重试，一次失败立即降级到池内下一个模型。
  # 2026-11-12：1 -> 0。原值 1 意味着单模型要试 2 次（每次最多 90s），
  # 这是 planner 两轮各 203s 墙钟的成因之一。fail-fast 后再靠模型池兜底。
  max_retries_per_model: 0
  failure_cooldown: 600         # 模型被判定失败后冷却秒数，冷却期内优先跳过它

# 全局默认参数，模型池条目可覆盖
defaults:
  temperature: 0.2
  max_tokens: 2048

# 分时定价调度。weekdays 用 ISO 编号(周一=1 ... 周日=7)，时段为本地时间闭区间起点、开区间终点。
scheduling:
  deepseek_peak_hours:
    weekdays: [1, 2, 3, 4, 5]
    peak_periods: ["09:00-12:00", "14:00-18:00"]
  strategies:
    # 2026-11-12：免费 hy3 档网关不存在，planner 主选已改为 workbuddy/hy3；此开关仅历史保留。
    planner_use_free_hy3: false
    peak_use_glm_as_fallback: true  # 峰时 file_reader/code_editor 跳过 deepseek-v4.1-flash

# --- 工具定义 ---------------------------------------------------------------
# 每个工具：
#   description: 给路由/规划模型看的工具说明
#   models:      模型池(有序)。每一项:
#                  - model:         magpie 模型 id
#                  - 可选覆盖:      temperature / max_tokens / timeout / weight
#                  - retry_on:      命中这些子串时视为失败并降级(默认含 common 错误)
tools:

  # 轻量：摘要/格式化已提供的文本（注意：无本地磁盘读取权限，读文件请用 pwsh Get-Content）
  # 谷时 deepseek-v4.1-flash 为主力；峰时由路由器跳过它，改用 glm-5.3-flash
  file_reader:
    description: 摘要/整理“已提供”的文本内容（无磁盘读取权限；要读本地文件请用 pwsh Get-Content）。
    models:
      - model: auto/deepseek-v4.1-flash
      - model: workbuddy/glm-5.3-flash

  # 代码生成/改写。Cursor 系列已整体移除（2026-11-12），主选换为
  # workbuddy/deepseek-v4.1-flash（与后两位不重复），保留 glm-flash 与 auto 两档兜底。
  code_editor:
    description: 生成或修改代码（纯文本生成，无本地磁盘读写权限；读写磁盘文件请用 pwsh）。
    models:
      - model: workbuddy/deepseek-v4.1-flash
      - model: workbuddy/glm-5.3-flash
      - model: auto/deepseek-v4.1-flash
    max_tokens: 4096
    # 单模型请求超时 120 秒：仍能覆盖慢模型，但故障转移更快（不再死等 300s）。
    timeout: 120

  # 「有可执行验证信号」场景专用（2026-11-13 新增）。与 code_editor 同为纯文本生成，无磁盘读写。
  #
  # 拆分理由：code_editor 一个池子服务所有代码文本任务，从「写个正则」到「按方案改完并跑通测试」
  # 共用同一主选。后者需要模型自己意识到「改完还得能被验证」，flash 级主选在该模式下产出常缺
  # 可执行验证落点，宿主还得二次返工。
  #
  # 主选 cursor/composer-2.5：该模型当初因与 cursor/grok-4.7 同批清理被连带移除，并非因自身慢
  #（移除计划记录 composer 当年冒烟 4.4s 正确，且明写「可随时恢复」）。2026-11-13 实测同题材：
  #   cursor/composer-2.5              5.9s / 198 completion token（约 34 tok/s，含函数+pytest断言）
  #   workbuddy/deepseek-v4.1-flash   1.3s / 33 token（约 25 tok/s）
  # 绝对延迟多 4.6s，但产出体积与结构化程度明显更高。仍保留两位 flash 兜底，挂掉自动回落。
  code_edit_with_signal:
    description: >
      生成或修改代码，用于「有可执行验证手段」的任务：需跑测试/修报错/按方案逐条改/需验证跑通。
      纯文本生成，无本地磁盘读写权限（读写文件请用 pwsh）。
      不适用于纯片段生成、改写、格式化、解释代码等无需验证的轻量场景（那种请用 code_editor）。
    models:
      - model: cursor/composer-2.5
        max_tokens: 6144
      - model: workbuddy/glm-5.3-flash
        max_tokens: 4096
      - model: workbuddy/deepseek-v4.1-flash
        max_tokens: 4096
    max_tokens: 6144
    # 强代码模型首 token 较慢，给足预算；仍快于全局 300s 口径。
    timeout: 150

  # 复杂推理/规划。与 plan_reviewer 同理，reasoning 模型需要足够 max_tokens，
  # 过低会被 reasoning 吃干预算后返回 502 empty reply。
  planner:
    description: 复杂任务的规划与推理。
    # 2026-11-13：依据 controller-bench T8-T11 综合对抗结果调序 —— gpt-6-luna（T_TOTAL 0.875 第1/均耗6.4s）、
    # gpt-5.6-luna（0.834 第2/Δ+0.067最大正）迁到首位，长任务（build/test）拆解时保住时间成本与步骤精简度；
    # deepseek-v4.1-flash 作第三级兜底。reasoning 模型须给足 max_tokens（过低会 502 empty reply）。
    models:
      - model: codex/gpt-6-luna
        max_tokens: 8192
      - model: codex/gpt-5.6-luna
        max_tokens: 8192
      - model: workbuddy/deepseek-v4.1-flash
        max_tokens: 8192
    max_tokens: 8192
    # 单模型请求超时 120 秒：仍能覆盖慢模型，但故障转移更快（不再死等 300s）。
    timeout: 120

  # 视觉/多模态 —— magpie 模型均支持图像输入
  # Cursor 系列已移除（2026-11-12）；auto 为主选，workbuddy 同型号兵底。
  image_analyst:
    description: 分析图像内容(截图/图表/照片)，做视觉理解。
    models:
      - model: auto/deepseek-v4.1-flash
      - model: workbuddy/deepseek-v4.1-flash
    max_tokens: 4096

  # 审查节点专用，不进规划工具列表。
  # 2026-11-13 去 glm 备选：controller-bench M3-3（幻觉工具题）glm 误判为 execute_tools，
  # guard 角色不能把清单外工具当真；且已核实失败路径 fail-closed（graph.py 模型失败即 DENY）。
  security_guard:
    description: 审查 pwsh / 写库参数，只输出 JSON。
    models:
      - model: workbuddy/deepseek-v4.1-flash
    max_tokens: 512
    timeout: 60

  # 写操作一审。明确安全才放行，拿不准或失败由 security_guard 终审。
  security_guard_fast:
    description: 写操作一审，只输出 JSON。
    models:
      - model: workbuddy/deepseek-v4.1-flash
    max_tokens: 256
    timeout: 30

  # 汇总器（node_summarize 专用，不进规划工具列表）。独立于 file_reader：
  # 失败时靠池内 failover 兜底，两级全失败由 graph.py 输出带 [未摘要] 标注的行级脱敏尾部。
  summarizer:
    description: 汇总各步骤结果为最终答复（node_summarize 专用）。
    models:
      - model: workbuddy/deepseek-v4.1-flash
      - model: workbuddy/glm-5.3-flash
    max_tokens: 2048
    timeout: 30

  # 计划审核器（plan_review op 专用）。高级模型严格审核 Markdown 计划是否  # 前因后果清楚、实施方案可落地且分布合理、有风险与回滚、有验证步骤。
  #
  # 2026-11-12 实测：deepseek-v4.1-flash 系列是 reasoning 模型，审一份完整计划时
  # reasoning 吃掉 7.9k–13.4k token。max_tokens=2048 会让预算全耗在 reasoning 上，
  # content 一个字都没开始写就截断，网关返回 502 empty reply（实测 40.8s 必失败）。
  # 抬到 8192 后两个模型均稳定输出（workbuddy 33.8s / auto 91.6s）。
  # 同模型池，按实测速度排序：workbuddy 比 auto 快约 2.7 倍。
  plan_reviewer:
    description: 高级方案审核员，严格审核 Markdown 计划，只输出 JSON（plan_review op 使用，不进规划工具列表）。
    models:
      # 2026-11-13 controller-bench 实测（14 模型×25 题）：grok-4.7@256k 路由校准唯一满分 1.00、
      # 总分 0.90 最高——审核员要绝对正确，故列首位；慢（13.3s）与计费（≈$0.02/次）可接受，
      # 失败自动落 deepseek 次选。
      - model: cursor/grok-4.7@256k
        max_tokens: 8192
      - model: workbuddy/deepseek-v4.1-flash
        max_tokens: 8192
      - model: auto/deepseek-v4.1-flash
        max_tokens: 8192
    max_tokens: 8192
    # 审核需要通读整份计划并逐条给结论，放宽超时。
    timeout: 300

  # 验证器（node_verify 专用，不进规划工具列表）。任务执行结束后核对「验证证据是否
  # 真正证明了结果」：逐改动步比对其声明的 verify.kind 与 run 级 evidence_pool 的实际产出。
  # grok-4.7 走 cursor 通道（与 headless 停用 cursor 作 planner/editor 不冲突）。
  # 必须实测 deepseek 兜底 failover：cursor 网关抽风时自动落 workbuddy/deepseek-v4.1-flash，
  # 否则会因 verified=false 让所有任务卡死（见 .plan/orchestrator-verification-gate-20261114.md）。
  verifier:
    description: 高级验证员，核对执行结果是否被证据真正证明，只输出 JSON（node_verify 专用）。
    models:
      - model: cursor/grok-4.7@256k
        max_tokens: 4096
      - model: workbuddy/deepseek-v4.1-flash
        max_tokens: 4096
      - model: auto/deepseek-v4.1-flash
        max_tokens: 4096
    max_tokens: 4096
    timeout: 120

  git:
    description: >
      本地只读 Git 摘要，不经模型。默认只执行 git status --short 与 git diff --stat，
      超过 20 行截断。rebase 或 stash 冲突只返回冲突文件名和 Conflict detected。
      不要用它执行 pull、rebase、push。
    local: true

  pwsh:
    description: >
      把自然语言转成一条 PowerShell 命令并执行。适用于查看目录、
      跑 Python 单测并读取失败（python -m pytest -q --tb=short）。
      Git 状态请用 git 工具，不要用本工具跑 git status/diff/pull/rebase。
      每步只做一件事。不要用它做 git push --force、reset --hard、删库或递归强删。
      【重要】真实执行只在 orchestrate op:"full" 路径发生；op:"tool" 只是纯文本
      补全，不会执行命令（模型会回答"我没有执行能力"）。要跑构建/命令/读盘请用 op:"full"。
    models:
      # reasoning 模型：max_tokens 必须大于 reasoning 开销，否则 content 被截断成空回复。
      - model: workbuddy/deepseek-v4.1-flash
        max_tokens: 4096
      - model: workbuddy/glm-5.3-flash
        max_tokens: 1024
    max_tokens: 4096
    timeout: 120

execution:
  mock_execution: false
  # 命令执行超时(秒)。与 pwsh 单请求超时保持一致；30s 会让 npm run build 必然超时。
  pwsh_timeout: 180

# 高危工具审查。deny_regex 只作为线索交给 security_guard，不自动拒绝。
security:
  guard_tool: security_guard
  fast_guard_tool: security_guard_fast
  guarded_tools: [pwsh, db_write]
  deny_regex:
    - '(?i)\bdrop\s+(table|database|schema)\b'
    - '(?i)\btruncate\s+(table\s+)?\S+'
    - '(?i)\brm\s+-[a-z]*r[a-z]*f\b|\brm\s+-[a-z]*f[a-z]*r\b'
    - '(?i)\bRemove-Item\b[\s\S]{0,80}-Recurse\b[\s\S]{0,40}-Force\b'
