# 本 bundle 自己的行。
#
# 注意：cordis 的 patch 规则是「非 insert 的 patch 必须命中已存在的条目」，
# 条目不存在时会被判 `entry not found` 直接跳过。所以新增插件必须用 `insert`
# 往树里插入，不能只写 `id:` 覆盖。用户级覆盖写进 profile 的
# cordis.patch.yml（它在这之后应用），那里就可以直接用 `id:` 命中这一条。
- insert:
    - id: channel-wechat-companion
      name: dsh-channel-wechat-companion
      config:
        # 推到哪个微信用户。留空 = 推给扫码登录的那个账号（channel-wechat 的登录者）。
        # 允许多个，逗号或换行分隔。填了就只推给这里列出的 id。
        peers: ''
        # completed | error | aborted。默认只推"完成"和"出错"。
        notify: 'completed,error'
        # 正文最多推多少字符；超出部分用省略号截断。0 表示不截断。
        maxChars: 1200
        # 是否把审批卡/提问卡转发到微信。
        cards: true
        # 同一会话两次推送的最小间隔（毫秒）。
        # 3000 是实测下限：更短的间隔连发几轮后会触发微信侧限流
        # （sendmessage 返回 -2 prepare failed，持续数分钟）。
        minIntervalMs: 3000
