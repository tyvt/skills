# dsh-agent-guard bundle 自己的行。
#
# cordis 的 patch 规则：非 insert 的 patch 必须命中已存在的条目，条目不存在会
# 被跳过并报 `entry not found`。所以新增插件必须用 `insert` 往树里插入。
# profile 级覆盖（~/.dsh/profiles/web/cordis.patch.yml）在本文件之后应用。
- insert:
    - id: agent-guard
      name: dsh-agent-guard
      config:
        enabled: true
        repair:
          toolName: true
          schema: true
          escalation: true
          semantics: true
        recovery:
          enabled: true
          # 内建 llm-retry 是「每会话每 provider 5 次」，用完就整轮报废。
          # 这里在预算之外再给 3 次带退避的机会。
          maxExtraRetries: 3
          # 额度型 429 重试意义有限，最多再给 1 次。
          rateLimitMaxExtraRetries: 1
          initialDelayMs: 1500
          maxDelayMs: 20000
          jitterRatio: 0.2
          # provider 要求等待超过 2 分钟就不重试，避免把会话挂住几小时。
          maxWaitMs: 120000
        ledgerPath: reports/agent-guard-ledger.jsonl
        askGuard:
          enabled: true
          # off=不启用；warn=只记 ledger 告警不阻断（灰度默认）；block=拦截二次补问。
          # 灰度判据与切换脚本见 dsh/scripts/ask-guard-promote.ps1。
          mode: block
        exploration:
          # 探索漂移拦截（.plan/explore-drift-guard-20261113）：
          # off=不启用；warn=只记 ledger 不阻断（灰度默认）；block=拒绝。
          # 子代理会话（header.parentSession 存在）整体豁免。
          # promote 门槛：warn ≥2 天且 ≥20 条中误拦 <10%。
          enabled: true
          mode: block
          maxWholeReadLines: 300
          firstReadLimit: 60
          minRepeatPattern: 3
          globRepeatWindowMs: 60000
        editPreflight:
          # edit 前置校验：old_string 不在盘上真实内容中即拒。零误伤可判定
          # （old_string 不在盘上 = 该次 edit 本必失败），直接 block。
          # 读盘失败/非 UTF-8/子代理一律放行。拒绝时回 grep -n 改法。
          enabled: true
          mode: block
        searchRetry:
          # 搜索失败换形态：同 pattern 检索失败后，下一次同形态提示换法。
          # 带语义判断（失败是执行后信号，经 session/event 记录），有误伤风险，
          # 先 warn 灰度只记 ledger，观察无误伤再 promote 到 block。
          enabled: true
          mode: warn
        # 探索前置记忆检索（.plan/openviking-viking-first）：
        # 本会话首次探索(read/grep/glob/pwsh)前若未查过 OpenViking，提示先
        # mcp__openviking__search。warn=只记 ledger（灰度默认）；block=拒绝。
        # 子代理豁免；带 offset/limit 的精确 read 豁免；用户说“别查记忆”可跳过。
        # promote 门槛：warn 观察误伤（构建/精确读不误拦）后再转 block。
        vikingFirst:
          enabled: true
          mode: warn
          tools:
            - read
            - grep
            - glob
            - pwsh
          skip: false
          skipPhrases:
            - 别查记忆
            - 不用查记忆
            - 直接看代码
            - 跳过记忆
        # 探索外包（explore-outsource，2026-11-17）：本会话首次探索动作前若未派只读子代理，
        # warn 提示先派 dsh-explore。派发工具（spawn_teammate/task/workflow/orchestrate）置位豁免；
        # 子代理会话豁免；带 offset/limit 的精确 read、非探索 pwsh 豁免。只 nudge 一次。
        # promote 门槛：warn 观察误伤（已派子代理/精确读不误报）后再转 block。
        exploreOutsource:
          enabled: true
          # 2026-11-20 灰度 promote：ledger 149 条 warn 抽检全为主会话真阳性
          # （read76/pwsh52/grep12/glob9，subagent=False），误拦率 0% < 10% 门槛，转 block 硬拦。
          mode: block
          tools:
            - read
            - grep
            - glob
            - pwsh
          dispatchTools:
            - spawn_teammate
            - task
            - workflow
            - orchestrate
        # 同类扇出（fanout，2026-11-17）：主会话连续 ≥threshold 次同类工具调用，
        # warn 提示改派子代理并行处理，避免串行逐个烧上下文。AGENTS.md 的
        # fanoutStreakThreshold 此前代码零实现，这是新计数。子代理豁免；换类即重置。
        # promote 门槛：warn 观察误伤后再转 block。
        fanout:
          enabled: true
          mode: warn
          threshold: 3
          tools:
            - read
            - grep
            - glob
            - edit
            - write
            - pwsh
        # 前端验证轮询（verify-loop，2026-11-20）：agent-browser/Start-Sleep 走 pwsh，
        # 按命令内容累计，超阈值 block。先 warn 灰度记 ledger，观察误报 ≥3天≥20条<10% 再转 block。
        # 验证门只合并不砍：拒绝文案引导合并多断言、禁裸 sleep。子代理豁免。
        verifyLoop:
          enabled: true
          mode: warn
          agentBrowserMax: 12
          sleepMax: 5
